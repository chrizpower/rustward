[package]
name = "rustward"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
