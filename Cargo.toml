[package]
name = "rustward"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
default-run = "rustward"

[dependencies]
rustix = { version = "1.1", features = ["fs"] }
getrandom = "0.4"
hex = "0.4"
hmac = "0.13"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = { version = "1.2.1", features = ["serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
croner = { version = "5.0.0", default-features = false, features = ["chrono"] }
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["net", "process"] }
zbus = { version = "5", features = ["blocking-api"] }
signal-hook-registry = "1.4"

hyper = { version = "1.11", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
tokio = { version = "1.52", features = ["net", "rt", "sync", "time"] }

tempfile = "3"

[features]
web-preview = []

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5", features = ["p2p"] }

[[example]]
name = "acceptance"
path = "examples/acceptance/main.rs"
