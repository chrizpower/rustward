[package]
name = "rustward"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = { version = "1.2.1", features = ["serde"] }
zbus = { version = "5", features = ["blocking-api"] }

[dev-dependencies]
tempfile = "3"
zbus = { version = "5", features = ["p2p"] }
