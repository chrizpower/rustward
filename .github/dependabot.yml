version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-dependencies:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /acceptance
    schedule:
      interval: weekly
    groups:
      docker-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: debian
        update-types: [version-update:semver-major]
