name: Linux builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-builds-${{ github.sha }}
  cancel-in-progress: false

jobs:
  checks:
    name: Project and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Run project checks
        run: |
          context="$(mktemp -d "$RUNNER_TEMP/rustward-checks.XXXXXX")"
          git archive HEAD -- .gitattributes Cargo.toml Cargo.lock Justfile build.rs \
            acceptance examples scripts src tests web |
            tar -xf - -C "$context"
          docker build --progress=plain --target project-checks \
            -f "$context/acceptance/Dockerfile" "$context"
      - name: Run browser tests
        env:
          RUSTWARD_WEB_CONTAINER: none
          RUSTWARD_SOURCE_REVISION: ${{ github.sha }}
        run: |
          npm --prefix web ci --include=dev
          npm --prefix web exec -- playwright install --with-deps chromium
          python3 -B tests/web/run.py

  package:
    needs: checks
    name: Package Linux ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and package the executables
        env:
          RUSTWARD_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python3 -B scripts/package-linux.py --engine docker --revision "$GITHUB_SHA" \
            --architecture "$RUSTWARD_ARCHITECTURE" --output "$RUNNER_TEMP/downloads"
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustward-linux-${{ matrix.architecture }}
          path: ${{ runner.temp }}/downloads/
          if-no-files-found: error
          compression-level: 0

  tag:
    if: github.ref == 'refs/heads/main'
    name: Publish Linux prerelease
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rustward-linux-*
          path: ${{ runner.temp }}/downloads
      - name: Tag the commit
        id: version
        run: |
          tag="$(python3 -B scripts/package-linux.py --revision "$GITHUB_SHA" --tag-for "$RUNNER_TEMP/downloads")"
          ref="refs/tags/$tag"
          existing="$(git ls-remote --refs origin "$ref")"
          if [ -z "$existing" ]; then
            run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
              tag --annotate "$tag" "$GITHUB_SHA" --message "Linux downloads: $run_url"
            git push origin "$ref"
          else
            git fetch --no-tags origin "$ref:$ref"
            test "$(git rev-parse "$ref^{commit}")" = "$GITHUB_SHA"
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - name: Publish the verified archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cd "$RUNNER_TEMP/downloads"
          assets=()
          for arch in x86_64 aarch64; do
            bundle="rustward-linux-$arch/rustward-linux-$arch.tar.gz"
            assets+=("$bundle" "$bundle.sha256")
          done

          if ! draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
              --title "$TAG" --notes "Linux development build for commit $GITHUB_SHA."
            draft=true
          fi
          if [[ "$draft" == true ]]; then
            gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          fi

          for asset in "${assets[@]}"; do
            printf 'sha256:%s  %s\n' "$(sha256sum "$asset" | cut -d' ' -f1)" "${asset##*/}"
          done | sort > expected.txt
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.digest)  \(.name)"' | sort > uploaded.txt
          diff -u expected.txt uploaded.txt

          if [[ "$draft" == true ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
