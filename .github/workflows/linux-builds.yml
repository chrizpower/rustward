name: Linux builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-builds-${{ github.sha }}
  cancel-in-progress: false

jobs:
  checks:
    name: Project and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install check tools
        run: |
          rustup component add rustfmt clippy llvm-tools-preview
          cargo install --locked --version 1.59.0 just
          cargo install --locked --version 0.9.1 cargo-llvm-cov
      - run: just check
      - name: Run browser tests
        env:
          RUSTWARD_WEB_CONTAINER: none
          RUSTWARD_SOURCE_REVISION: ${{ github.sha }}
        run: |
          npm --prefix web exec -- playwright install --with-deps chromium
          just web-test

  package:
    needs: checks
    name: Package Linux ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build and package the executables
        env:
          RUSTWARD_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          python3 -B scripts/package-linux.py --engine docker --revision "$GITHUB_SHA" \
            --architecture "$RUSTWARD_ARCHITECTURE" --output "$RUNNER_TEMP/downloads"
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rustward-linux-${{ matrix.architecture }}
          path: ${{ runner.temp }}/downloads/
          if-no-files-found: error
          compression-level: 0

  tag:
    if: github.ref == 'refs/heads/main'
    name: Tag the build
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rustward-linux-*
          path: ${{ runner.temp }}/downloads
      - name: Tag the commit
        run: |
          tag="$(python3 -B scripts/package-linux.py --revision "$GITHUB_SHA" --tag-for "$RUNNER_TEMP/downloads")"
          ref="refs/tags/$tag"
          existing="$(git ls-remote --refs origin "$ref")"
          if [ -z "$existing" ]; then
            run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
              tag --annotate "$tag" "$GITHUB_SHA" --message "Linux downloads: $run_url"
            git push origin "$ref"
          else
            git fetch --no-tags origin "$ref:$ref"
            test "$(git rev-parse "$ref^{commit}")" = "$GITHUB_SHA"
          fi
          printf 'Linux executables for `%s` are available in this run’s artifacts.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
