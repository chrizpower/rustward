version: 1
tasks:
  - id: synthetic-report
    label: Synthetic report
    executable: /synthetic/runtime/bin/report
    working_directory: /synthetic/runtime
    arguments:
      - literal: --name
      - input: name
      - input: count
      - input: enabled
    inputs:
      - id: name
        type: string
        required: true
      - id: count
        type: integer
        default: 2
        choices: [1, 2, 3]
      - id: enabled
        type: boolean
        default: false
